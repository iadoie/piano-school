<style>
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #efeeeb;
    --text: #1a1a1a; --text2: #6b6b68; --text3: #9c9a92;
    --border: #dddcd7;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --bg2: #232322; --bg3: #2c2c2a;
      --text: #e8e6df; --text2: #9c9a92; --text3: #6b6b68;
      --border: #3d3d3a;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px 16px; max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 16px; }
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input {
    width: 100%; padding: 8px 12px 8px 34px; font-size: 14px;
    border: 0.5px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); outline: none; font-family: var(--font);
  }
  .search-wrap input:focus { border-color: var(--text3); }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 12px;
    cursor: pointer; font-weight: 500; user-select: none;
    border: 1.5px solid transparent; transition: border-color 0.15s;
  }
  .badge.active { border-color: currentColor; }
  .chart-wrap {
    overflow-x: auto; border: 0.5px solid var(--border);
    border-radius: 12px; background: var(--bg2); padding: 12px 8px;
  }
  .chart-wrap svg { display: block; min-width: 680px; }
  .info-panel {
    margin-top: 14px; padding: 14px 18px;
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: 12px; display: none;
  }
  .info-panel.show { display: block; }
  .info-top { display: flex; gap: 14px; align-items: flex-start; }
  .info-photo {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
    background: var(--bg3); flex-shrink: 0; display: none;
  }
  .info-photo.loaded { display: block; }
  .info-body { flex: 1; min-width: 0; }
  .info-name { font-size: 17px; font-weight: 500; }
  .info-badge-s { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; margin-left: 8px; vertical-align: 2px; display: inline-block; }
  .info-meta { font-size: 13px; color: var(--text2); margin: 4px 0 8px; }
  .info-note { font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
  .info-links { font-size: 13px; display: flex; gap: 20px; flex-wrap: wrap; }
  .info-links span.lb { color: var(--text3); margin-right: 4px; }
  .info-links span.lk { cursor: pointer; font-weight: 500; margin-right: 6px; }
  .info-links span.lk:hover { text-decoration: underline; }
  .clear-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 0.5px solid var(--border); background: var(--bg);
    color: var(--text2); cursor: pointer; font-family: var(--font);
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none;
  }
  .clear-btn.show { display: inline-block; }
</style>
</head>

function getConn(id){
  const t=new Set(),s=new Set(),e=[];
  EDGES.forEach(ed=>{if(ed[0]===id){s.add(ed[1]);e.push(ed);}if(ed[1]===id){t.add(ed[0]);e.push(ed);}});
  return{teachers:t,students:s,edges:e};
}

async function fetchPhoto(wiki){
  if(!wiki||photoCache[wiki]!==undefined)return photoCache[wiki]||null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(wiki));
    const d=await r.json();const url=d.thumbnail?.source||null;photoCache[wiki]=url;return url;
  }catch{photoCache[wiki]=null;return null;}
}

function render(){
  const svg=document.getElementById("chart");
  svg.setAttribute("viewBox","0 0 700 "+svgH);
  const conn=selected?getConn(selected):{teachers:new Set(),students:new Set(),edges:[]};
  const cSet=new Set([...conn.teachers,...conn.students]);
  if(selected)cSet.add(selected);

  let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  ERAS.forEach((era,i)=>{
    const y=54+i*rowH;
    h+=`<line x1="10" y1="${y-22}" x2="690" y2="${y-22}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 4"/>`;
    h+=`<text x="12" y="${y-8}" font-size="10" fill="var(--text3)" font-weight="500" font-family="var(--font)">${era[0]}</text>`;
  });

  EDGES.forEach(e=>{
    const f=pos[e[0]],t=pos[e[1]];if(!f||!t)return;
    const isHL=selected&&conn.edges.some(ce=>ce[0]===e[0]&&ce[1]===e[1]);
    const sm=activeSchool&&(pianists[e[0]]?.school===activeSchool||pianists[e[1]]?.school===activeSchool);
    let op,col,sw;
    if(selected){op=isHL?.75:.03;col=isHL?(SCHOOLS[pianists[e[0]].school]?.c||"#888"):"var(--text3)";sw=isHL?1.8:.4;}
    else if(activeSchool){op=sm?.5:.04;col=sm?(SCHOOLS[pianists[e[0]].school]?.c||"#888"):"var(--text3)";sw=sm?1.2:.4;}
    else{op=.13;col="var(--text3)";sw=.5;}
    const mx=(f.x+t.x)/2,my=(f.y+t.y)/2,dx=t.x-f.x;
    const bend=Math.abs(dx)>200?(dx>0?-15:15):0;
    const mk=isHL?' marker-end="url(#ah)"':'';
    h+=`<path d="M${f.x} ${f.y} Q${mx+bend} ${my} ${t.x} ${t.y}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}"${mk}/>`;
  });

  pList.forEach(p=>{
    const xy=pos[p.id];if(!xy)return;
    const isSel=p.id===selected,isC=cSet.has(p.id),sc=SCHOOLS[p.school];
    let op;
    if(searchIds){op=searchIds.includes(p.id)?1:(selected&&isC?1:.1);}
    else if(selected){op=isC?1:.1;}
    else if(activeSchool){op=p.school===activeSchool?1:.1;}
    else{op=1;}
    const r=isSel?10:(selected&&isC&&!isSel)?8:5.5;
    h+=`<g onclick="sel('${p.id}')" style="cursor:pointer" opacity="${op}">`;
    if(isSel)h+=`<circle cx="${xy.x}" cy="${xy.y}" r="${r+4}" fill="${sc.c}" opacity="0.15"/>`;
    h+=`<circle cx="${xy.x}" cy="${xy.y}" r="${r}" fill="${sc.c}" stroke="${isSel?sc.t:'none'}" stroke-width="${isSel?2:0}"/>`;
    h+=`<text x="${xy.x}" y="${xy.y+r+11}" text-anchor="middle" font-size="9" font-weight="${isSel||(selected&&isC)?600:400}" fill="${isSel||(selected&&isC)?'var(--text)':'var(--text2)'}" font-family="var(--font)">${p.name}</text>`;
    h+='</g>';
  });
  svg.innerHTML=h;
  renderInfo(conn);
}

async function renderInfo(conn){
  const panel=document.getElementById("info");
  if(!selected){panel.classList.remove("show");return;}
  const sp=pianists[selected],sc=SCHOOLS[sp.school];
  let h=`<div class="info-top"><img class="info-photo" id="pp" alt=""><div class="info-body">`;
  h+=`<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="info-name">${sp.full}</span>`;
  h+=`<span class="info-badge-s" style="background:${sc.bg};color:${sc.t}">${sc.name}</span></div>`;
  h+=`<div class="info-meta">${sp.birth}–${sp.death||"present"} · ${sp.role}</div>`;
  h+=`<div class="info-note">${sp.note}</div>`;
  if(conn.teachers.size>0||conn.students.size>0){
    h+='<div class="info-links">';
    if(conn.teachers.size>0){h+='<div><span class="lb">Teachers:</span>';conn.teachers.forEach(tid=>{if(pianists[tid])h+=`<span class="lk" style="color:${SCHOOLS[pianists[tid].school]?.c||'#888'}" onclick="sel('${tid}')">${pianists[tid].name}</span>`;});h+='</div>';}
    if(conn.students.size>0){h+='<div><span class="lb">Students:</span>';conn.students.forEach(sid=>{if(pianists[sid])h+=`<span class="lk" style="color:${SCHOOLS[pianists[sid].school]?.c||'#888'}" onclick="sel('${sid}')">${pianists[sid].name}</span>`;});h+='</div>';}
    h+='</div>';
  }
  h+='</div></div>';
  panel.innerHTML=h;panel.style.borderLeft=`3px solid ${sc.c}`;panel.classList.add("show");
  document.getElementById("clearBtn").classList.add("show");
  if(sp.wiki){const url=await fetchPhoto(sp.wiki);const img=document.getElementById("pp");if(img&&url){img.src=url;img.classList.add("loaded");}}
}

function sel(id){
  selected=(selected===id)?null:id;
  // Clear school filter when selecting a pianist
  activeSchool=null;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  if(!selected)document.getElementById("clearBtn").classList.remove("show");
  render();
}

function clearAll(){
  selected=null;activeSchool=null;searchIds=null;
  document.getElementById("search").value="";
  document.getElementById("clearBtn").classList.remove("show");
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  render();
}

function toggleSchool(key,el){
  selected=null;searchIds=null;
  document.getElementById("search").value="";
  activeSchool=(activeSchool===key)?null:key;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  if(activeSchool)el.classList.add("active");
  render();
}

const bc=document.getElementById("badges");
Object.entries(SCHOOLS).forEach(([key,s])=>{
  const sp=document.createElement("span");
  sp.className="badge";sp.textContent=s.name;sp.style.background=s.bg;sp.style.color=s.t;
  sp.onclick=function(){toggleSchool(key,this);};
  bc.appendChild(sp);
});

document.getElementById("search").addEventListener("input",function(){
  selected=null;activeSchool=null;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  const q=this.value.toLowerCase().trim();
  if(!q){searchIds=null;render();return;}
  searchIds=pList.filter(p=>p.name.toLowerCase().includes(q)||p.full.toLowerCase().includes(q)||p.note.toLowerCase().includes(q)).map(p=>p.id);
  render();
});

render();
</script>
</body>
</html>
