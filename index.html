const pianists={};
P.forEach(r=>{pianists[r[0]]={id:r[0],name:r[1],full:r[2],birth:r[3],death:r[4],school:r[5],role:r[6],note:r[7],wiki:r[8]};});
const pList=Object.values(pianists);

function eraIdx(b){for(let i=ERAS.length-1;i>=0;i--)if(b>=ERAS[i][1][0])return i;return 0;}
const grouped=ERAS.map(()=>[]);
pList.forEach(p=>grouped[eraIdx(p.birth)].push(p));
grouped.forEach(a=>a.sort((a,b)=>a.birth-b.birth));

// Use full available width
const W=1300;
const pos={};
const rowH=100,startY=68;
grouped.forEach((era,ei)=>{
  const y=startY+ei*rowH,n=era.length;
  const sp=Math.min(80,(W-40)/(n));
  const tw=sp*(n-1);
  const sx=Math.max(20,(W-tw)/2);
  era.forEach((p,i)=>{pos[p.id]={x:sx+i*sp,y:y+(i%2===0?0:22)};});
});
const svgH=startY+ERAS.length*rowH+40;

let selected=null,activeSchool=null,searchIds=null;
const photoCache={};

function getConn(id){
  const t=new Set(),s=new Set(),e=[];
  EDGES.forEach(ed=>{if(ed[0]===id){s.add(ed[1]);e.push(ed);}if(ed[1]===id){t.add(ed[0]);e.push(ed);}});
  return{teachers:t,students:s,edges:e};
}

async function fetchPhoto(wiki){
  if(!wiki||photoCache[wiki]!==undefined)return photoCache[wiki]||null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(wiki));
    const d=await r.json();const url=d.thumbnail?.source||null;photoCache[wiki]=url;return url;
  }catch{photoCache[wiki]=null;return null;}
}

function render(){
  const svg=document.getElementById("chart");
  svg.setAttribute("viewBox","0 0 "+W+" "+svgH);
  svg.style.width="100%";
  const conn=selected?getConn(selected):{teachers:new Set(),students:new Set(),edges:[]};
  const cSet=new Set([...conn.teachers,...conn.students]);
  if(selected)cSet.add(selected);

  let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  ERAS.forEach((era,i)=>{
    const y=58+i*rowH;
    h+=`<line x1="10" y1="${y-22}" x2="${W-10}" y2="${y-22}" stroke="#a2a9b1" stroke-width="0.5" stroke-dasharray="4 4"/>`;
    h+=`<text x="12" y="${y-8}" font-size="11" fill="#000" font-weight="bold" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">${era[0]}</text>`;
  });

  EDGES.forEach(e=>{
    const f=pos[e[0]],t=pos[e[1]];if(!f||!t)return;
    const isHL=selected&&conn.edges.some(ce=>ce[0]===e[0]&&ce[1]===e[1]);
    const sm=activeSchool&&(pianists[e[0]]?.school===activeSchool||pianists[e[1]]?.school===activeSchool);
    let op,col,sw;
    if(selected){op=isHL?.8:.03;col=isHL?(SCHOOLS[pianists[e[0]].school]?.c||"#888"):"#ccc";sw=isHL?2:.4;}
    else if(activeSchool){op=sm?.55:.04;col=sm?(SCHOOLS[pianists[e[0]].school]?.c||"#888"):"#ccc";sw=sm?1.2:.4;}
    else{op=.15;col="#888";sw=.5;}
    const mx=(f.x+t.x)/2,my=(f.y+t.y)/2,dx=t.x-f.x;
    const bend=Math.abs(dx)>250?(dx>0?-18:18):0;
    const mk=isHL?' marker-end="url(#ah)"':'';
    h+=`<path d="M${f.x} ${f.y} Q${mx+bend} ${my} ${t.x} ${t.y}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${op}"${mk}/>`;
  });

  // Square nodes
  pList.forEach(p=>{
    const xy=pos[p.id];if(!xy)return;
    const isSel=p.id===selected,isC=cSet.has(p.id),sc=SCHOOLS[p.school];
    let op;
    if(searchIds){op=searchIds.includes(p.id)?1:(selected&&isC?1:.1);}
    else if(selected){op=isC?1:.1;}
    else if(activeSchool){op=p.school===activeSchool?1:.1;}
    else{op=1;}
    const sz=isSel?16:(selected&&isC&&!isSel)?14:10;
    const half=sz/2;
    h+=`<g onclick="sel('${p.id}')" style="cursor:pointer" opacity="${op}">`;
    if(isSel)h+=`<rect x="${xy.x-half-3}" y="${xy.y-half-3}" width="${sz+6}" height="${sz+6}" fill="${sc.c}" opacity="0.15"/>`;
    h+=`<rect x="${xy.x-half}" y="${xy.y-half}" width="${sz}" height="${sz}" fill="${sc.c}" stroke="${isSel?'#000':'none'}" stroke-width="${isSel?1.5:0}"/>`;
    h+=`<text x="${xy.x}" y="${xy.y+half+12}" text-anchor="middle" font-size="10" font-weight="${isSel||(selected&&isC)?'bold':'normal'}" fill="${isSel||(selected&&isC)?'#000':'#202122'}" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">${p.name}</text>`;
    h+='</g>';
  });
  svg.innerHTML=h;
  renderInfo(conn);
}

async function renderInfo(conn){
  const panel=document.getElementById("info");
  if(!selected){panel.classList.remove("show");return;}
  const sp=pianists[selected],sc=SCHOOLS[sp.school];
  let h=`<div class="info-top"><img class="info-photo" id="pp" alt=""><div class="info-body">`;
  h+=`<div><span class="info-name">${sp.full}</span>`;
  h+=`<span class="info-badge-s" style="background:${sc.bg};color:${sc.t};border-color:${sc.c}">${sc.name}</span></div>`;
  h+=`<div class="info-meta">${sp.birth}–${sp.death||"present"} · ${sp.role}</div>`;
  h+=`<div class="info-note">${sp.note}</div>`;
  if(conn.teachers.size>0||conn.students.size>0){
    h+='<div class="info-links">';
    if(conn.teachers.size>0){h+='<div><span class="lb">Teachers:</span>';conn.teachers.forEach(tid=>{if(pianists[tid])h+=`<span class="lk" style="color:${SCHOOLS[pianists[tid].school]?.c||'#888'}" onclick="sel('${tid}')">${pianists[tid].name}</span>`;});h+='</div>';}
    if(conn.students.size>0){h+='<div><span class="lb">Students:</span>';conn.students.forEach(sid=>{if(pianists[sid])h+=`<span class="lk" style="color:${SCHOOLS[pianists[sid].school]?.c||'#888'}" onclick="sel('${sid}')">${pianists[sid].name}</span>`;});h+='</div>';}
    h+='</div>';
  }
  h+='</div></div>';
  panel.innerHTML=h;panel.style.borderLeft=`3px solid ${sc.c}`;panel.classList.add("show");
  document.getElementById("clearBtn").classList.add("show");
  if(sp.wiki){const url=await fetchPhoto(sp.wiki);const img=document.getElementById("pp");if(img&&url){img.src=url;img.classList.add("loaded");}}
}

function sel(id){
  selected=(selected===id)?null:id;
  activeSchool=null;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  if(!selected)document.getElementById("clearBtn").classList.remove("show");
  render();
}

function clearAll(){
  selected=null;activeSchool=null;searchIds=null;
  document.getElementById("search").value="";
  document.getElementById("clearBtn").classList.remove("show");
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  render();
}

function toggleSchool(key,el){
  selected=null;searchIds=null;
  document.getElementById("search").value="";
  activeSchool=(activeSchool===key)?null:key;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  if(activeSchool)el.classList.add("active");
  render();
}

const bc=document.getElementById("badges");
Object.entries(SCHOOLS).forEach(([key,s])=>{
  const sp=document.createElement("span");
  sp.className="badge";sp.textContent=s.name;
  sp.onclick=function(){toggleSchool(key,this);};
  bc.appendChild(sp);
});

document.getElementById("search").addEventListener("input",function(){
  selected=null;activeSchool=null;
  document.querySelectorAll(".badge").forEach(b=>b.classList.remove("active"));
  const q=this.value.toLowerCase().trim();
  if(!q){searchIds=null;render();return;}
  searchIds=pList.filter(p=>p.name.toLowerCase().includes(q)||p.full.toLowerCase().includes(q)||p.note.toLowerCase().includes(q)).map(p=>p.id);
  render();
});

render();
</script>
</body>
</html>
